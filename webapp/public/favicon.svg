<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Reticle mark, matching .brand-mark in tokens.css. Drawn at 32px with
       heavier strokes than the header SVG because a favicon renders at 16px and
       the header's 1.9 stroke disappears at that size. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d80f7"/>
      <stop offset=".65" stop-color="#5a44d4"/>
      <stop offset="1" stop-color="#4835ab"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <circle cx="16" cy="16" r="8"/>
    <path d="M16 3.5v4M16 24.5v4M3.5 16h4M24.5 16h4"/>
  </g>
  <circle cx="16" cy="16" r="3" fill="#fff"/>
</svg>
